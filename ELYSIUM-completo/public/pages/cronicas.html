<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Suas Crônicas no Elysium."><title>Minhas Crônicas | Elysium</title><link rel="stylesheet" href="../css/app.css"><style>.hub{max-width:1250px;margin:auto;padding:1.4rem clamp(1rem,3vw,3rem) 4rem}.hub-header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:2rem}.hub-header h1{font:600 clamp(2.4rem,6vw,4.5rem)/.9 "Cormorant Garamond",serif}.chronicle-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.chronicle-card{min-height:245px;display:flex;flex-direction:column}.chronicle-card h2{font:600 1.65rem/1 "Cormorant Garamond",serif;margin-top:.7rem}.chronicle-card .description{margin-top:.7rem;flex:1}.hub-panel{margin-bottom:1rem}.account{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}@media(max-width:900px){.chronicle-grid{grid-template-columns:1fr}.hub-header{flex-direction:column}.account{width:100%}}</style></head><body><main class="hub"><header class="hub-header"><div><p class="eyebrow">Crônicas</p><h1>Minhas Crônicas</h1><p style="color:var(--muted);margin-top:.55rem">Organize suas mesas e continue de onde parou.</p></div><div class="account"><span id="user-name" class="tag"></span><a class="button-ghost" id="admin-link" href="/pages/admin.html" hidden>Admin</a><button class="button-ghost" id="join-toggle">Entrar com convite</button><button class="button" id="create-toggle">Nova Crônica</button><button class="button-ghost" id="logout">Sair</button></div></header>
<section class="card hub-panel" id="join-panel" hidden><div class="card-header"><div><p class="eyebrow">Convite</p><h3>Entrar em uma Crônica</h3></div></div><form id="join-form" class="form-grid"><div class="form-group full"><label>Código do convite</label><input id="invite-code" placeholder="Ex.: A1B2C3D4"></div><div class="form-actions full"><button class="button">Entrar na Crônica</button></div></form></section>
<section class="card hub-panel" id="create-panel" hidden><div class="card-header"><div><p class="eyebrow">Nova Crônica</p><h3>Defina o primeiro registro da noite</h3></div></div><form id="chronicle-form" class="form-grid"><div class="form-group"><label>Nome</label><input id="chronicle-name" required maxlength="100"></div><div class="form-group"><label>Subtítulo</label><input id="chronicle-subtitle" maxlength="120"></div><div class="form-group"><label>Cidade</label><input id="chronicle-city"></div><div class="form-group"><label>Período</label><input id="chronicle-period" placeholder="2026, Anos 90..."></div><div class="form-group"><label>Estilo</label><input id="chronicle-style" placeholder="Intriga política, horror pessoal..."></div><div class="form-group"><label>Banner (URL)</label><input id="chronicle-banner"></div><div class="form-group full"><label>Descrição</label><textarea id="chronicle-description"></textarea></div><div class="form-actions full"><button class="button" id="create-button">Criar Crônica</button></div></form></section>
<section class="chronicle-grid" id="chronicles"></section></main><div class="toast" id="toast" hidden></div><script type="module" src="../js/cronicas.js"></script></body></html>
