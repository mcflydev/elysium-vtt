<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transmissão | Elysium</title><link rel="stylesheet" href="../css/app.css"><style>body{overflow:hidden}.broadcast{height:100vh;display:grid;grid-template-rows:1fr auto;background:#050506}.broadcast-scene{position:relative;background:#0b0b0d center/cover no-repeat;display:flex;align-items:end;padding:clamp(1.4rem,5vw,4rem)}.broadcast-scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(4,4,5,.94))}.broadcast-copy{position:relative;z-index:1;max-width:1000px}.broadcast-copy h1{font:600 clamp(3rem,8vw,7rem)/.85 "Cormorant Garamond",serif}.broadcast-copy p{color:#d7cec9;max-width:760px;margin-top:1rem;line-height:1.6}.broadcast-bottom{padding:.8rem 1.2rem;border-top:1px solid var(--border);display:flex;gap:1rem;justify-content:space-between;align-items:center}.broadcast-roll{font-size:.8rem}.broadcast-event{color:#dba2ad;font-size:.78rem}.broadcast-overlay{position:fixed;inset:0;background:#030304;z-index:20;display:grid;place-items:center;padding:3rem;text-align:center}.broadcast-overlay h2{font:600 clamp(3rem,9vw,8rem)/.85 "Cormorant Garamond",serif}.broadcast-overlay p{font-size:1.1rem;color:#d8cfca;margin-top:1rem}.broadcast-overlay img{max-width:80vw;max-height:60vh}</style></head><body><main class="broadcast"><section class="broadcast-scene" id="broadcast-scene"><div class="broadcast-copy"><p class="eyebrow">Cena atual</p><h1 id="scene-title">Elysium</h1><p id="scene-description">A sessão ainda não começou.</p></div></section><footer class="broadcast-bottom"><div class="broadcast-event" id="event">Sem evento ativo</div><div class="broadcast-roll" id="roll">Nenhuma rolagem recente</div></footer></main><div class="broadcast-overlay" id="overlay" hidden><div id="overlay-content"></div></div><script type="module" src="../js/transmissao.js"></script></body></html>
